apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: todo-app
          image: funmiacr.azurecr.io/todo-app:v1
          ports:
            - containerPort: 80